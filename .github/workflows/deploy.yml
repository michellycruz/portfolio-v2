name: Deploy

# Build a cada push no master. O deploy em si só roda se os secrets da VPS
# estiverem configurados (veja .github/DEPLOY.md), então dá para commitar este
# arquivo antes de configurar nada: o build roda como CI e o deploy é pulado.
on:
  push:
    branches: [master]
  workflow_dispatch:

# Dois deploys simultâneos trocariam o binário um por cima do outro.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Verificar se o deploy está configurado
        id: cfg
        env:
          HOST: ${{ secrets.VPS_HOST }}
          USER_: ${{ secrets.VPS_USER }}
          KEY: ${{ secrets.VPS_SSH_KEY }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          SERVICE_NAME: ${{ vars.SERVICE_NAME }}
        run: |
          missing=""
          [ -n "$HOST" ]         || missing="$missing VPS_HOST"
          [ -n "$USER_" ]        || missing="$missing VPS_USER"
          [ -n "$KEY" ]          || missing="$missing VPS_SSH_KEY"
          [ -n "$DEPLOY_PATH" ]  || missing="$missing DEPLOY_PATH"
          [ -n "$SERVICE_NAME" ] || missing="$missing SERVICE_NAME"
          if [ -n "$missing" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Deploy pulado - faltam:$missing. Veja .github/DEPLOY.md"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      # ---------- build (sempre roda, serve de CI) ----------

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build do frontend
        working-directory: frontend
        env:
          # Vazio de propósito: em produção o binário Go serve a SPA e a API na
          # mesma origem, então as chamadas viram /api/... relativas. Se ficar
          # indefinida, lib/api.ts cai no default http://localhost:8080 e o
          # site publicado tenta falar com a máquina do visitante.
          VITE_API_URL: ''
        run: |
          npm ci
          npm run build

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache: false   # o projeto não tem dependências externas, não há go.sum

      - name: Build do backend
        working-directory: backend
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: ${{ vars.VPS_ARCH || 'amd64' }}
        run: go build -trimpath -ldflags="-s -w" -o portfolio .

      # ---------- deploy ----------

      - name: Configurar SSH
        if: steps.cfg.outputs.ready == 'true'
        env:
          KEY: ${{ secrets.VPS_SSH_KEY }}
          HOST: ${{ secrets.VPS_HOST }}
          USER_: ${{ secrets.VPS_USER }}
          PORT: ${{ vars.VPS_PORT || '22' }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -p "$PORT" -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
          cat >> ~/.ssh/config <<EOF
          Host vps
            HostName $HOST
            User $USER_
            Port $PORT
            IdentityFile ~/.ssh/id_deploy
            IdentitiesOnly yes
          EOF
          chmod 600 ~/.ssh/config

      - name: Enviar build para a VPS
        if: steps.cfg.outputs.ready == 'true'
        env:
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
        run: |
          ssh vps "mkdir -p '$DEPLOY_PATH/dist'"
          # --delete só na pasta dist, que é 100% gerada. Nunca na raiz do app:
          # é lá que mora o .env com as credenciais SMTP, fora do git. Sem ele o
          # backend se recusa a subir (checkMailConfig) e o site cai.
          rsync -az --delete frontend/dist/ "vps:$DEPLOY_PATH/dist/"
          rsync -az backend/portfolio "vps:$DEPLOY_PATH/portfolio.new"

      - name: Trocar o binário e reiniciar
        if: steps.cfg.outputs.ready == 'true'
        env:
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          SERVICE_NAME: ${{ vars.SERVICE_NAME }}
        run: |
          ssh vps "DEPLOY_PATH='$DEPLOY_PATH' SERVICE_NAME='$SERVICE_NAME' bash -se" <<'REMOTE'
          set -euo pipefail
          cd "$DEPLOY_PATH"
          # Guarda o binário atual para rollback manual rápido.
          [ -f portfolio ] && cp -f portfolio portfolio.prev || true
          # Para antes de trocar: substituir um executável em uso dá ETXTBSY.
          sudo systemctl stop "$SERVICE_NAME"
          mv -f portfolio.new portfolio
          chmod +x portfolio
          sudo systemctl start "$SERVICE_NAME"
          sleep 2
          sudo systemctl is-active --quiet "$SERVICE_NAME" \
            || { echo "servico nao subiu:"; sudo journalctl -u "$SERVICE_NAME" -n 30 --no-pager; exit 1; }
          REMOTE

      - name: Conferir que o site atualizou
        if: steps.cfg.outputs.ready == 'true'
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://michellycruz.com.br' }}
        run: |
          # Espera o serviço responder.
          for i in $(seq 1 20); do
            curl -fsS --max-time 5 "$SITE_URL/healthz" >/dev/null && break
            [ "$i" = 20 ] && { echo "healthz nao respondeu"; exit 1; }
            sleep 3
          done

          # Prova de que o bundle novo está no ar: o hash do asset servido tem
          # que bater com o que acabamos de buildar. É o que faltou detectar no
          # deploy antigo, em que o site ficou servindo uma build de dias atrás.
          esperado=$(grep -o 'assets/index-[^"]*\.js' frontend/dist/index.html | head -1)
          publicado=$(curl -fsS --max-time 10 "$SITE_URL/" | grep -o 'assets/index-[^"]*\.js' | head -1)
          echo "esperado:  $esperado"
          echo "publicado: $publicado"
          [ -n "$esperado" ] && [ "$esperado" = "$publicado" ] \
            || { echo "::error::O site ainda serve uma build antiga."; exit 1; }
          echo "Deploy confirmado."
